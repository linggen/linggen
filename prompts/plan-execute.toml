# Plan execution instructions injected when executing an approved plan.

[default]
description = "Instructions for executing an approved plan"
vars = ["plan_text", "items"]
text = '''
## Executing Approved Plan

The user approved the plan below. Carry it out step by step.

The planning conversation may have been cleared. Read files before modifying them — do not rely on what planning saw, and locate code with Grep or Read rather than trusting any line numbers.

### Guidelines

- Follow the steps in order unless dependencies require otherwise.
- If a step needs adjustment, take the corrected approach; if it is no longer needed, skip it and say why.
- Run the plan's Verification before you finish.

### Progress tracking

The checklist already exists — it was made from the plan's steps:

{items}

Update it with UpdatePlan as you go: send the whole list each time, keep these ids and titles, and give each item an `active_form` ("Running tests"). Exactly ONE item is `in_progress` at a time — mark it as you start it and `completed` the moment it is done. Never mark an item completed while tests fail or an error is unresolved; keep it `in_progress` and add an item for the blocker. Remove items that turn out not to apply.

### The Plan

{plan_text}'''
