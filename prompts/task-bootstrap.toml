# First user message of an autonomous run — a mission, a delegated subagent,
# a headless agent run — where the input really is a task. A person's chat
# turn never gets this wrapper: it reaches the model verbatim
# (PromptProfile::task_bootstrap).
# Category: environment snapshot (per Claude Code conventions)

[default]
description = "Initial user message of an autonomous run: workspace info and task"
vars = ["ws_root", "platform", "role", "workspace_listing", "task"]
text = '''
Autonomous agent loop started.

Workspace root: {ws_root}
Platform: {platform}
Current Role: {role}

Workspace contents:
{workspace_listing}

Task: {task}

Work through this task step by step. Use tools to explore the codebase before making changes. When finished, emit a done action with a summary of what was accomplished.'''
