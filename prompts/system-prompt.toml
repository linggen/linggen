# Static system prompt sections assembled into the system prompt.
# Category: system-prompt-* (per Claude Code conventions)

[fallback_identity]
description = "Default system prompt when no agent spec is configured"
text = "You are a helpful AI assistant."

[skills_header]
description = "Section header listing available skills for the Skill tool"
text = "\n\n## Available Skills\n\nUse the `Skill` tool to invoke a skill by name. Available skills:"

[skill_entry]
description = "One line per available skill"
vars = ["name", "description"]
text = "\n- **{name}**: {description}"

[active_skill_frame]
description = "Wraps the active skill content injected into the system prompt"
vars = ["name", "description", "content"]
text = '''

--- ACTIVE SKILL ---
Skill: {name}
Description: {description}

{content}
-------------------'''

[active_mission_frame]
description = "Wraps the active mission content injected into the system prompt. Mirrors active_skill_frame — the mission body is step-by-step instructions the agent executes autonomously."
vars = ["name", "description", "content"]
text = '''

--- ACTIVE MISSION ---
Mission: {name}
Description: {description}

{content}
----------------------'''

[app_skill_dashboard_hint]
description = "Generic PageUpdate reminder appended after an app-skill body. Only used when the skill body itself does not already document PageUpdate."
text = '''


## Dashboard updates

This skill has a dashboard UI. Call `PageUpdate` whenever state the user should see has changed — task complete, new results, progress changed.

Pass `top_bar`, `body`, and/or `footer` as flat top-level arguments — there is NO `page` wrapper. Omit any section you don't want to change (previous values persist). At least one section must be provided and non-empty; an empty call is an error and will be rejected.

Example shape (fill in per your skill's schema):
```
PageUpdate({ "top_bar": [...], "body": [...], "footer": {"text": "..."} })
```

Do not emit page JSON as text — always use the tool.
'''

[project_instructions_header]
description = "Opening delimiter for project context files"
text = "\n\n--- PROJECT INSTRUCTIONS ---"

[project_instructions_entry]
description = "One project context file"
vars = ["label", "content"]
text = "\n\n# {label}\n\n{content}"

[project_instructions_footer]
description = "Closing delimiter for project context files"
text = "\n\n--- END PROJECT INSTRUCTIONS ---"

[core_memory_block]
description = "Populated head of the always-on memory block: the `tier=core` rows from the store. The shared tail (save triggers, retrieval-visibility, usage rules) lives in `core_memory_shared`, appended after this by the engine."
vars = ["core_facts"]
text = '''

# Always-on memory

Memory rows the engine pulls from the `ling-mem` store and injects into
every owner-user session's system prompt. Trust as current truth unless
contradicted by something the user just said in chat. Replaced (never
appended to) each time the system prompt is rebuilt — content is always
the current `tier=core` snapshot, never a running log.

## Rows

{core_facts}'''

[core_memory_block_empty]
description = "Empty head of the always-on memory block: bootstrap hint shown when the store has no `tier=core` rows yet. The shared tail (`core_memory_shared`) is appended after this by the engine, same as the populated head."
vars = []
text = '''

# Always-on memory

The memory store has no `tier=core` rows yet — the always-on block is
empty. As stable universals about the user come up (identity: name,
role, timezone, languages; working style: tone, format, pacing,
universal do/don't rules), save them as core rows via
`memory_add({tier: "core", ...})` so they reach every
future session. The dashboard (local memory UI / linggen.dev) also
exposes a core view for curating the set.'''

[core_memory_shared]
description = "Shared tail of the always-on memory block, appended after either head (populated or empty) by the engine. Only the rules about USING the injected core rows live here — the memory protocol itself (capture, conflicts, imperatives, tiers, chips) is the memory server's own MCP instructions, injected with every other connected server's instructions."
vars = []
text = '''

## Usage rules for the always-on rows

- Apply the core rows above as current truth; no need to query for them.
- Keep `tier=core` tiny — every row pollutes every unrelated session,
  so the bar is *stable universal*, not "useful sometimes". Scoped and
  on-demand facts live in the rest of the store (`memory_search` /
  `memory_add` without `tier: "core"`).
- Legacy rows may carry `contexts: ["project/<name>"]` from an older
  scheme; include that context alongside `cross-project` when searching
  inside that project (derive `<name>` as the workspace root's single
  last path component). Don't write new `project/<name>` rows.
--- END ALWAYS-ON MEMORY ---'''

[delegation_header]
description = "Task delegation block: the delegation rule plus the list of available agents. Replaces the old Available-Agents-for-Delegation header + the standalone response-format.native_rules_task bullet — both used to render back-to-back."
text = '''


## Task Delegation

When delegating via the Task tool, pass a concrete task description — do not just plan to delegate.

Available agents:'''

[delegation_entry]
description = "One line per available agent"
vars = ["name", "description"]
text = "\n- **{name}**: {description}"

[environment_block]
description = "Runtime environment context"
vars = ["platform", "os_version", "timezone", "locale", "shell", "ws_root", "interface_mode"]
text = '''

# Environment
- Platform: {platform}
- OS: {os_version}
- Timezone: {timezone}
- Locale: {locale}
- Shell: {shell}
- Workspace: {ws_root}
- Interface: {interface_mode}
- Bash tool: non-interactive subprocess (no TTY, no stdin). Interactive programs (curses, GUI) cannot run inside it. For such programs, write the code and instruct the user to run it in their terminal.'''

[right_now_block]
description = "Volatile per-turn read of the user's situation and this machine's world — injected for sessions that hold the `sense` tool, so a companion need not spend a round trip fetching it"
vars = ["presence", "idle", "active_runs", "runs_today", "local_time", "part_of_day", "world"]
text = '''

# Right now
- Them: {presence} (last input {idle} ago)
- Work: {active_runs} running, {runs_today} today
- Time: {local_time}, {part_of_day}
{world}

This is your perception — the room, and the machine you live in — already in
front of you. Read it and decide whether and how to speak. Never read it aloud
or recite the numbers. These are readings taken this instant: say what they say,
and never assert a condition that is not here.'''

[consumer_frame]
description = "Consumer-specific instructions — replaces environment/project/memory for room consumers"
text = '''

# Consumer Session

You are serving a user through a shared proxy room. Important constraints:

- Your available tools and skills are listed above. Do not attempt to use any others.
- Do not ask the user for additional permissions — all permission requests will be denied.
- Do not reference file paths, project structure, workspace contents, or the server environment.
- Focus on the conversation and the tools available to you.'''

