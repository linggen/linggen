[package]
name = "linggen"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
description = "Linggen — the root system for AI agents. A local-first runtime for AI apps."
repository = "https://github.com/linggen/linggen"

# One workspace, one Cargo.lock. The root package is the `ling` binary (its
# server, CLI and the embedded web UI); `crates/linggen-engine` is the rest
# of the engine, and memory (`crates/linggen-memory`, imported from the
# linggen-memory repo) is hosted by it — see doc/architecture-review.md § 2.
# A bare `cargo build`/`test`/`clippy` covers the binary and the engine.
[workspace]
members = [".", "crates/linggen-engine", "crates/linggen-memory"]
default-members = [".", "crates/linggen-engine"]

# One version for the binary and the engine crate (scripts/sync-version.sh
# stamps this line).
[workspace.package]
version = "2.3.0"

[features]
# Anonymous usage telemetry (install + command events sent to
# linggen.dev/api/track). See crates/linggen-engine/src/telemetry/mod.rs for the
# exact field list.
# Disable at runtime: env LINGGEN_NO_TELEMETRY=1 OR file ~/.linggen/no-telemetry.
# Disable at compile time: cargo build --no-default-features.
default = ["telemetry", "kokoro"]
telemetry = ["linggen-engine/telemetry"]
# Kokoro-82M on candle — the local voice Yinyue falls back to when the GPU
# voice (Qwen3-TTS in the managed runtime's MLX sidecar) isn't there: Intel
# Macs, Linux, a first run before the runtime has downloaded, or a sidecar
# failure. Shipped builds keep it. `--no-default-features --features telemetry`
# drops candle and any-tts entirely; the fallback is then `say`.
kokoro = ["dep:any-tts"]

[[bin]]
name = "ling"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# AES-256-GCM for the sealed push note (already in the tree via rustls).
ring = "0.17"
qrcode = "0.14"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = "8.0"
futures-util = "0.3"
mime_guess = "2.0"
tracing = "0.1"
toml = "1.0"
serde_norway = "0.9"
dirs = "6.0"
notify = "8"
tempfile = "3"
url = "2"
libc = "0.2"
rand = "0.10.0"
chrono = "0.4"
# Vendored fork (vendor/str0m + vendor/sctp-proto, wired via [patch.crates-io]):
# larger SCTP send window, sane RTO floor, gentler fast-retransmit backoff for
# lossy relay paths. Diffs are marked "LINGGEN PATCH"; re-carry them on upgrade
# and validate with `cargo test --test rtc_link_bench -- --ignored --nocapture`.
str0m = "0.21"
open = "5.3.3"
urlencoding = "2.1.3"
flate2 = "1.1.9"
# Memory, hosted in this process (`memory_host`). Its own telemetry stays
# off: the engine's is the one that counts.
linggen-memory = { path = "crates/linggen-memory", default-features = false }
# Everything but the server, the CLI and `main` (doc/architecture-review.md
# § 2). Its telemetry follows this package's `telemetry` feature.
linggen-engine = { path = "crates/linggen-engine", default-features = false }

# any-tts (Kokoro voice). `metal` + `accelerate` are Apple-only candle backends
# — they pull in objc2*, which `compile_error!`s on non-Apple targets — so enable
# them only on macOS. Other platforms build the portable CPU candle backend.
[target.'cfg(target_os = "macos")'.dependencies]
any-tts = { version = "0.1.2", optional = true, default-features = false, features = ["kokoro", "download", "metal", "accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Bonjour: macOS registers through mDNSResponder (server/api/pair/bonjour).
mdns-sd = "0.21"
any-tts = { version = "0.1.2", optional = true, default-features = false, features = ["kokoro", "download"] }

# One hermetic world as its own process, for the web UI tests (tests/e2e):
# the same world-builder as tests/system, run as a plain program.
[[test]]
name = "world"
path = "tests/world/main.rs"
harness = false

[dev-dependencies]
# The system tests (tests/system) draw pictures and rewrite configs with these.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1"
# The engine's empty registries and wire-type derives, for this package's tests.
linggen-engine = { path = "crates/linggen-engine", default-features = false, features = ["test-support"] }
# Memory's deterministic test embedder, for the door tests of /api/memory/<verb>.
linggen-memory = { path = "crates/linggen-memory", default-features = false, features = ["test-support"] }
# TypeScript bindings for the wire types the UI reads — emitted by
# `cargo test export_bindings` into ui/src/types/generated/ (scripts/gen-types.sh).
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
# System tests (tests/system/, doc/test-design.md § 2): the fake model and
# snapshots. Test-only — llmposter is AGPL and never reaches the shipped
# binary; its server runs inside the test process.
llmposter = { version = "0.5", default-features = false }
insta = { version = "1", features = ["filters"] }

# Optimize dependencies even in dev builds. The engine crate itself stays at
# opt-level 0 (fast incremental compiles), but numerical deps like candle
# (Kokoro TTS) run 20-50x faster optimized — unoptimized candle makes synthesis
# unusably slow (~47s/utterance vs ~1s).
[profile.dev.package."*"]
opt-level = 3
# `"*"` is every package but the workspace's own; memory's store code
# (LanceDB queries, the change log) is as slow unoptimized as its deps.
[profile.dev.package.linggen-memory]
opt-level = 3

# Day-to-day builds of the live engine: release speed, but only what changed is rebuilt
# (one edit: 56 s → 8–18 s, measured 2026-11-15). Shipping builds use `release`.
[profile.fast]
inherits = "release"
incremental = true

[patch.crates-io]
str0m = { path = "vendor/str0m" }
sctp-proto = { path = "vendor/sctp-proto" }
